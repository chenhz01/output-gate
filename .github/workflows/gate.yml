name: output-gate
on: [push, pull_request]
jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: help loads
        run: python gate.py --help
      - name: run bundled example
        # Runs the documented example exactly as the README shows it, then asserts
        # the exit code equals the value registered for this gate.
        # Before 2026-10-20 this step only checked "output is non-empty" and ended
        # with exit 0 — so two gates whose example errored on a fresh clone
        # (exit 2) still showed a green badge. A self-check that cannot go red
        # is decoration.
        run: |
          set +e
          python gate.py run ai-output examples/draft.md --format text > out.txt 2>&1
          code=$?
          cat out.txt
          test -s out.txt || { echo "no output — gate did not run"; exit 1; }
          if [ "$code" != "1" ]; then
            echo "::error title=output-gate::exit=$code but the documented example exits 1. A gate that errors on its own example is not a passing self-check."
            exit 1
          fi
          echo "exit=$code (expected 1)"
          exit 0

      - name: "design ruleset: quiet on clean, loud on blocked"
        run: |
          set +e
          python gate.py run design rulesets/design/fixtures/design_pass.html > a.txt 2>&1; ca=$?
          python gate.py run design rulesets/design/fixtures/design_fail.html > b.txt 2>&1; cb=$?
          cat a.txt b.txt
          [ "$ca" = "0" ] || { echo "::error title=output-gate::design clean fixture exit=$ca (expected 0) — a gate that fires on clean input is worse than no gate"; exit 1; }
          [ "$cb" = "1" ] || { echo "::error title=design blocked fixture exit=$cb (expected 1) — this ruleset is shipped but does not fail"; exit 1; }
          echo "design: clean=0 blocked=1"
      - name: "ecommerce ruleset: quiet on clean, loud on blocked"
        run: |
          set +e
          python gate.py run ecommerce rulesets/ecommerce/fixtures/listing_clean.json > a.txt 2>&1; ca=$?
          python gate.py run ecommerce rulesets/ecommerce/fixtures/listing_fail.json > b.txt 2>&1; cb=$?
          cat a.txt b.txt
          [ "$ca" = "0" ] || { echo "::error title=output-gate::ecommerce clean fixture exit=$ca (expected 0) — a gate that fires on clean input is worse than no gate"; exit 1; }
          [ "$cb" = "1" ] || { echo "::error title=ecommerce blocked fixture exit=$cb (expected 1) — this ruleset is shipped but does not fail"; exit 1; }
          echo "ecommerce: clean=0 blocked=1"
      - name: "music ruleset: quiet on clean, loud on blocked"
        run: |
          set +e
          python gate.py run music examples/track_pass.json > a.txt 2>&1; ca=$?
          python gate.py run music examples/track_fail.json > b.txt 2>&1; cb=$?
          cat a.txt b.txt
          [ "$ca" = "0" ] || { echo "::error title=output-gate::music clean fixture exit=$ca (expected 0) — a gate that fires on clean input is worse than no gate"; exit 1; }
          [ "$cb" = "1" ] || { echo "::error title=music blocked fixture exit=$cb (expected 1) — this ruleset is shipped but does not fail"; exit 1; }
          echo "music: clean=0 blocked=1"
      - name: "shortvideo ruleset: quiet on clean, loud on blocked"
        run: |
          set +e
          python gate.py run shortvideo rulesets/shortvideo/fixtures/script_fail.json > a.txt 2>&1; ca=$?
          cat a.txt
          [ "$ca" = "1" ] || { echo "::error title=output-gate::shortvideo blocked fixture exit=$ca (expected 1) — this ruleset is shipped but does not fail"; exit 1; }
          echo "shortvideo: blocked=1 (only the failing fixture is committed for this ruleset)"
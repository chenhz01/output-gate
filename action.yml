name: output-gate
description: Before AI-written text ships, run the four checks it always fails.
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: Arguments passed to gate.py
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
